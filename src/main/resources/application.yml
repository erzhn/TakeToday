
spring:
  application:
    name: taketoday

  # PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taketoday}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:0000}

  # Hibernate / JPA
  jpa:
    # Схему БД создаёт Flyway, Hibernate только проверяет
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway: миграции базы данных
  flyway:
    enabled: true

  # Thymeleaf
  thymeleaf:
    cache: false

  # Загрузка файлов
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # Профиль разработки
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Отправка электронной почты через Gmail
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    connection-timeout: 5000

    timeout: 5000
    write-timeout: 5000

# Веб-сервер
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

# Настройки TakeToday
app:
  # Почта, с которой отправляются письма
  mail-from: ${MAIL_USERNAME}

  # Данные первого администратора
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  frontend-origin: http://localhost:5173

  # Папка для логотипов заведений (раздаётся по адресу /uploads/**)
  upload-dir: ${UPLOAD_DIR:uploads}
