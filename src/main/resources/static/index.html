<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b5e20">
    <title>TakeToday — еда со скидкой в Бишкеке</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Общие стили сайта (как в кабинетах) + стили этой страницы -->
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
    <!--/* Общие мелочи интерфейса, как на остальных страницах: меню на телефоне */-->
    <script src="/js/app.js" defer></script>
</head>
<body>
<!-- Главная, вход, регистрация, код из письма и сброс пароля — одна страница (app.js), экраны 1 и 12 в Figma -->
<!--/* Та же разметка шапки, что в fragments/layout.html (Thymeleaf): при переходе между главной
      и остальными страницами шапка не «прыгает». Ссылки заполняет app.js — от роли пользователя. */-->
<header class="site-header" id="site-header">
    <div class="container header-row">
        <div class="header-left">
            <a href="/" class="logo" aria-label="TakeToday — на главную">Take<span>Today</span></a>
            <span class="pill serif hide-mobile hide-tablet">
                <span class="material-symbols-outlined icon-sm">location_on</span>Бишкек
                <span class="material-symbols-outlined icon-sm">expand_more</span>
            </span>
        </div>
        <nav id="nav" class="nav header-nav" aria-label="Основное меню"></nav>
        <div class="header-right">
            <span id="nav-right" class="header-right"></span>
            <button type="button" class="icon-button menu-toggle" data-menu-toggle aria-expanded="false" aria-label="Меню">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
    </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
    <div class="container footer-row">
        <div class="footer-brand">
            <div><span class="logo logo-sm">Take<span>Today</span></span> • Кыргызстан, Бишкек</div>
            <div>© 2026 TakeToday, Бишкек. Все права защищены.</div>
        </div>
        <nav class="footer-links" aria-label="Ссылки в подвале">
            <a href="/how">Как это работает</a>
            <a href="mailto:partners@taketoday.kg">Заведениям и пекарням</a>
            <a href="mailto:support@taketoday.kg">Поддержка</a>
        </nav>
    </div>
</footer>
</body>
</html>
