services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taketoday
      POSTGRES_USER: ${DB_USER:-taketoday}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d taketoday"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  postgres_data:
